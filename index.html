<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <!-- Root Wrapper -->
    <main id="rootWrapper">
        <!-- Single Double Quote Symbol -->
        <p id="quoteSymbol">&ldquo;</p>
        <!-- Quote Text -->
        <p id="quoteText">Lorem ipsum dolor sit amet consectetur adipisicing elit.
            Repellendus omnis, temporibus impedit nihil autem itaque id,
            culpa praesentium dicta nemo sint a ea aliquam labore,
            fugit eligendi, minima, enim facilis.</p>
        <!-- Quote Author -->
        <p id="quoteAuthor">Tiger Insights</p>
        <!-- Get Quote Button -->
        <button id="getQuoteBtn">Get Another Quote</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
